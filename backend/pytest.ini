[pytest]
testpaths = tests
pythonpath = .
# Browser tests skip themselves with a reason unless LINX_E2E=1, a frontend
# build, and playwright are all present — a visible skip beats silently
# deselecting them, since "the browser tests didn't run" is worth knowing.
markers =
    e2e: browser-driven test (needs LINX_E2E=1, a frontend build, and playwright)
filterwarnings =
    error::DeprecationWarning:app.*
